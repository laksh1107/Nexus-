apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
  namespace: nexus
spec:
  replicas: 2
  selector:
    matchLabels: {app: nexus-api}
  template:
    metadata:
      labels: {app: nexus-api}
    spec:
      containers:
        - name: api
          image: nexus-api:2.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://nexus:nexus-local-change-me@nexus-postgres:5432/nexus"
            - name: REDIS_URL
              value: "redis://nexus-redis:6379/0"
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-api
  namespace: nexus
spec:
  selector: {app: nexus-api}
  ports: [{port: 8000, targetPort: 8000}]
