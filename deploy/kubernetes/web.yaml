apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-web
  namespace: nexus
spec:
  replicas: 2
  selector:
    matchLabels: {app: nexus-web}
  template:
    metadata:
      labels: {app: nexus-web}
    spec:
      containers:
        - name: web
          image: nexus-web:2.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://nexus-api:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-web
  namespace: nexus
spec:
  type: NodePort
  selector: {app: nexus-web}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30300}]
